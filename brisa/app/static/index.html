<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brisa — Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="sidebar" class="sidebar"></div>
  <div class="main">
    <div class="page">
      <div class="page-header">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <div>
            <h1 class="page-title"><span class="live-dot"></span>Dashboard</h1>
            <p class="page-subtitle" id="last-updated">Fetching…</p>
          </div>
          <button class="btn btn-ghost" id="apply-btn">
            ▶ Apply Now
          </button>
        </div>
      </div>

      <div id="dashboard-content">
        <div style="color:var(--text-muted); padding:40px 0; text-align:center; font-size:13px">Loading…</div>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="/app.js"></script>
  <script>
    let lastState = null;

    async function loadState() {
      try {
        const data = await api('GET', '/state');
        lastState = data;
        renderDashboard(data);
        document.getElementById('last-updated').textContent =
          'Updated ' + new Date().toLocaleTimeString();
      } catch (e) {
        showToast('Failed to load state: ' + e.message, 'error');
      }
    }

    function cardId(prefix, id) {
      return prefix + btoa(unescape(encodeURIComponent(id))).replace(/[^a-zA-Z0-9]/g, '');
    }

    function renderDashboard(data) {
      const container = document.getElementById('dashboard-content');
      const hasFanGroups = data.fan_groups && data.fan_groups.length;
      const hasSensorGroups = data.sensor_groups && data.sensor_groups.length;
      const hasUngroupedFans = data.ungrouped_fans && data.ungrouped_fans.length;
      const hasUngroupedSensors = data.ungrouped_sensors && data.ungrouped_sensors.length;
      const hasAnything = hasFanGroups || hasSensorGroups || hasUngroupedFans || hasUngroupedSensors;
      container.replaceChildren();

      if (!hasAnything) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        const mark = document.createElement('div');
        mark.style.cssText = 'font-size:32px;margin-bottom:8px';
        mark.textContent = '〜';
        const message = document.createElement('p');
        message.textContent = 'No fans or sensors to display.';
        const guidance = document.createElement('p');
        guidance.style.marginTop = '8px';
        guidance.append('Configure fans in ');
        const fanLink = document.createElement('a');
        fanLink.href = '/fanconfig.html';
        fanLink.style.color = 'var(--accent)';
        fanLink.textContent = 'Fan Config';
        guidance.append(fanLink, ' or set up dashboard groups in ');
        const deviceLink = document.createElement('a');
        deviceLink.href = '/devices.html';
        deviceLink.style.color = 'var(--accent)';
        deviceLink.textContent = 'Sensors & Fans';
        guidance.append(deviceLink, '.');
        empty.append(mark, message, guidance);
        container.appendChild(empty);
        return;
      }

      if (hasFanGroups || hasUngroupedFans) {
        const category = createCategory('Fan Speeds');

        for (const grp of (data.fan_groups || [])) {
          const group = renderGroup(grp, fanCardElement);
          if (group) category.appendChild(group);
        }

        if (hasUngroupedFans) {
          category.appendChild(hasFanGroups
            ? createGroup('Other', data.ungrouped_fans, fanCardElement, true)
            : createCardGrid(data.ungrouped_fans, fanCardElement));
        }
        container.appendChild(category);
      }

      if (hasSensorGroups || hasUngroupedSensors) {
        const category = createCategory('Temperatures');

        for (const grp of (data.sensor_groups || [])) {
          const group = renderGroup(grp, sensorCardElement);
          if (group) category.appendChild(group);
        }

        if (hasUngroupedSensors) {
          category.appendChild(hasSensorGroups
            ? createGroup('Other', data.ungrouped_sensors, sensorCardElement, true)
            : createCardGrid(data.ungrouped_sensors, sensorCardElement));
        }
        container.appendChild(category);
      }
      updateValues(data);
    }

    function createCategory(titleText) {
      const category = document.createElement('div');
      category.className = 'dash-category';
      const header = document.createElement('div');
      header.className = 'dash-category-header';
      const title = document.createElement('span');
      title.className = 'dash-category-title';
      title.textContent = titleText;
      const line = document.createElement('div');
      line.className = 'dash-category-line';
      header.append(title, line);
      category.appendChild(header);
      return category;
    }

    function createCardGrid(items, cardFactory) {
      const grid = document.createElement('div');
      grid.className = 'grid-4';
      items.forEach(item => grid.appendChild(cardFactory(item)));
      return grid;
    }

    function createGroup(name, items, cardFactory, muted = false) {
      const group = document.createElement('div');
      group.className = 'dash-group';
      const header = document.createElement('div');
      header.className = 'dash-group-header';
      const accent = document.createElement('div');
      accent.className = 'dash-group-accent';
      const title = document.createElement('span');
      title.className = 'dash-group-title';
      title.textContent = name;
      if (muted) {
        accent.style.background = 'var(--text-muted)';
        title.style.color = 'var(--text-dim)';
      }
      header.append(accent, title);
      group.append(header, createCardGrid(items, cardFactory));
      return group;
    }

    function renderGroup(group, cardFactory) {
      return group.items.length ? createGroup(group.name, group.items, cardFactory) : null;
    }

    function fanCardElement(fan) {
      const cid = cardId('fan-card-', fan.id);
      const card = document.createElement('div');
      card.className = 'stat-card';
      card.id = cid;
      if (fan.color) card.dataset.color = fan.color;
      const label = document.createElement('div');
      label.className = 'stat-label';
      label.textContent = fan.label || fan.id;
      if (fan.override_percent != null) {
        const badge = document.createElement('span');
        badge.className = 'badge badge-warn';
        badge.style.cssText = 'margin-left:6px;font-size:10px';
        badge.textContent = 'MANUAL';
        label.appendChild(badge);
      }
      const values = document.createElement('div');
      values.style.cssText = 'display:flex;align-items:baseline;justify-content:space-between';
      const rpm = document.createElement('div');
      const value = document.createElement('span');
      value.className = 'stat-value';
      value.id = 'val-' + cid;
      value.textContent = '—';
      const unit = document.createElement('span');
      unit.className = 'stat-unit';
      unit.textContent = 'rpm';
      rpm.append(value, unit);
      const percent = document.createElement('span');
      percent.className = 'mono';
      percent.style.cssText = 'font-size:12px;color:var(--text-muted)';
      percent.id = 'pct-' + cid;
      values.append(rpm, percent);
      card.append(label, values);
      return card;
    }

    function sensorCardElement(s) {
      const cid = cardId('temp-card-', s.sensor_id);
      const label = s.alias || s.sensor_id.split('/').pop();
      const card = document.createElement('div');
      card.className = 'stat-card';
      card.id = cid;
      if (s.color) card.dataset.color = s.color;
      const labelElement = document.createElement('div');
      labelElement.className = 'stat-label';
      labelElement.title = s.sensor_id;
      labelElement.textContent = label;
      if (s.virtual === true) {
        const badge = document.createElement('span');
        badge.className = 'badge badge-dim';
        badge.style.cssText = 'margin-left:6px;font-size:10px';
        badge.textContent = 'VIRTUAL';
        labelElement.appendChild(badge);
      }
      const values = document.createElement('div');
      const value = document.createElement('span');
      value.className = 'stat-value';
      value.id = 'val-' + cid;
      value.textContent = '—';
      const unit = document.createElement('span');
      unit.className = 'stat-unit';
      unit.textContent = '°C';
      values.append(value, unit);
      card.append(labelElement, values);
      return card;
    }

    function updateValues(data) {
      // Update fan values
      const allFans = [
        ...(data.fan_groups || []).flatMap(g => g.items),
        ...(data.ungrouped_fans || []),
      ];
      allFans.forEach(fan => {
        const cid = cardId('fan-card-', fan.id);
        const valEl = document.getElementById('val-' + cid);
        flashValue(valEl, fmtRpm(fan.current_rpm));
        const pctEl = document.getElementById('pct-' + cid);
        if (pctEl) pctEl.textContent = fan.last_percent != null ? '(' + fan.last_percent + '%)' : '';
      });

      // Update sensor values
      const allSensors = [
        ...(data.sensor_groups || []).flatMap(g => g.items),
        ...(data.ungrouped_sensors || []),
      ];
      allSensors.forEach(s => {
        const cid = cardId('temp-card-', s.sensor_id);
        const valEl = document.getElementById('val-' + cid);
        flashValue(valEl, fmtTemp(s.temp));
      });
    }

    async function applyNow() {
      const btn = document.getElementById('apply-btn');
      btn.disabled = true;
      btn.textContent = 'Applying…';
      try {
        await api('POST', '/apply');
        showToast('Applied — fans updated', 'ok');
        await loadState();
      } catch (e) {
        showToast('Apply failed: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '▶ Apply Now';
      }
    }

    document.getElementById('apply-btn').addEventListener('click', applyNow);
    loadState();
    setInterval(loadState, 10000);
  </script>
</body>
</html>
